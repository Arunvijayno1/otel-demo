name: Observability Tests

on: [push]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # -------------------------
      # Node Setup
      # -------------------------
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Node dependencies
        run: npm install

      # -------------------------
      # Python Setup
      # -------------------------
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install requests

      # -------------------------
      # Start Jaeger
      # -------------------------
      - name: Start Jaeger
        run: |
          docker run -d --name jaeger \
            --network=host \
            -e COLLECTOR_ZIPKIN_HTTP_PORT=9411 \
            jaegertracing/all-in-one:latest

      # -------------------------
      # Start Prometheus (FIXED)
      # -------------------------
      - name: Start Prometheus
        run: |
          docker run -d --name prometheus \
            -p 9090:9090 \
            --add-host=host.docker.internal:host-gateway \
            -v ${{ github.workspace }}/prometheus.yml:/etc/prometheus/prometheus.yml \
            prom/prometheus

      # -------------------------
      # Wait for Jaeger
      # -------------------------
      - name: Wait for Jaeger
        run: |
          for i in {1..20}; do
            curl -s http://localhost:16686 > /dev/null && echo "Jaeger ready" && break
            echo "Waiting for Jaeger..."
            sleep 3
          done

      # -------------------------
      # Start App
      # -------------------------
      - name: Start App
        run: |
          node app.js &

      # -------------------------
      # Wait for App
      # -------------------------
      - name: Wait for App
        run: |
          for i in {1..20}; do
            curl -s http://localhost:3000/health > /dev/null && echo "App ready" && break
            echo "Waiting for App..."
            sleep 2
          done

      # -------------------------
      # Wait for Prometheus scrape
      # -------------------------
      - name: Wait before tests
        run: sleep 15
      # DEBUG START
      - name: Debug App Metrics Endpoint
        run: curl http://localhost:9464/metrics | head -n 20
      
      - name: Debug Prometheus Health
        run: curl http://localhost:9090/-/ready

      - name: Debug Prometheus Targets
        run: curl http://localhost:9090/api/v1/targets

      - name: Debug Prometheus Query
        run: curl "http://localhost:9090/api/v1/query?query=http_server_duration_count"
      # DEBUG END

      # -------------------------
      # Run Tests
      # -------------------------
      - name: Run Observability Tests
        run: python run_all_tests.py