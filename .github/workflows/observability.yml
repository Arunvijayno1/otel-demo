name: Observability Tests

on: [push]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # Node setup
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Node dependencies
        run: npm install

      # Python setup
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install requests

      # Start Jaeger
      - name: Start Jaeger
        run: |
          docker run -d --name jaeger \
            -p 16686:16686 \
            -p 4318:4318 \
            jaegertracing/all-in-one

      # Wait for Jaeger
      - name: Wait for Jaeger
        run: |
          for i in {1..20}; do
            curl -s http://localhost:16686 > /dev/null && echo "Jaeger ready" && break
            echo "Waiting for Jaeger..."
            sleep 3
          done

      # Start Prometheus
      - name: Start Prometheus
        run: |
          docker run -d --name prometheus \
            -p 9090:9090 \
            -v ${{ github.workspace }}/prometheus.yml:/etc/prometheus/prometheus.yml \
            prom/prometheus

      # Wait for Prometheus
      - name: Wait for Prometheus
        run: |
          for i in {1..20}; do
            curl -s http://localhost:9090 > /dev/null && echo "Prometheus ready" && break
            echo "Waiting for Prometheus..."
            sleep 3
          done

      # Start App
      - name: Start App
        run: |
          node app.js &

      # Wait for App
      - name: Wait for App
        run: |
          for i in {1..20}; do
            curl -s http://localhost:3000/health > /dev/null && echo "App ready" && break
            echo "Waiting for App..."
            sleep 2
          done

      # Generate traffic
      - name: Generate traffic
        run: |
          for i in {1..10}; do
            curl http://localhost:3000/orders > /dev/null
            sleep 1
          done

      # Wait for telemetry
      - name: Wait for telemetry
        run: sleep 20

      # Run tests
      - name: Run Observability Tests
        run: python run_all_tests.py